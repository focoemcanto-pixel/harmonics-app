name: Finance Bridge CI
on:
  pull_request:
    paths:
      - 'app/api/internal/finance-bridge/**'
      - 'lib/finance-bridge/**'
      - 'supabase/migrations/20261104*'
      - 'tests/finance-bridge.test.mjs'
      - 'package.json'
      - '.github/workflows/finance-bridge-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run test:finance-bridge
      - run: npm test
      - run: npm run build
