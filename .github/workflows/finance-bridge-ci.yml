name: Finance Bridge CI
on:
  pull_request:
    paths:
      - 'app/api/internal/finance-bridge/**'
      - 'lib/finance-bridge/**'
      - 'supabase/migrations/20261104*'
      - 'supabase/migrations/20261107130000_op_finance_payment_sync.sql'
      - 'tests/finance-payment-sync-persistence.sql'
      - 'supabase/migrations/20261108210000_op_finance_bridge_receivables.sql'
      - 'tests/finance-bridge-receivables.sql'
      - 'tests/finance-bridge.test.mjs'
      - 'tests/finance-bridge-persistence.sql'
      - 'package.json'
      - '.github/workflows/finance-bridge-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: finance_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run test:finance-bridge
      - name: PostgreSQL isolated financial bridge, rollback-only
        run: PGPASSWORD=synthetic-ci-only psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d finance_synthetic -f tests/finance-bridge-persistence.sql
      - name: PostgreSQL payment-to-cash sync, rollback-only
        run: PGPASSWORD=synthetic-ci-only psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d finance_synthetic -f tests/finance-payment-sync-persistence.sql
      - name: PostgreSQL bridge receivables, rollback-only
        run: PGPASSWORD=synthetic-ci-only psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d finance_synthetic -f tests/finance-bridge-receivables.sql
      - run: npm test
      - run: npm run build
