name: Harmonics scheduled automations

on:
  schedule:
    # 09:05–18:05 em America/Sao_Paulo (UTC-3)
    - cron: '5 12-21 * * *'
  workflow_dispatch:

concurrency:
  group: harmonics-scheduled-automations
  cancel-in-progress: false

jobs:
  run-automation-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run Harmonics date automations
        env:
          CRON_SECRET: ${{ secrets.HARMONICS_CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="https://app.bandaharmonics.com/api/automation/cron"
          if [ -n "${CRON_SECRET:-}" ]; then
            curl --fail --show-error --silent --retry 2 --max-time 120 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "$URL"
          else
            curl --fail --show-error --silent --retry 2 --max-time 120 "$URL"
          fi
