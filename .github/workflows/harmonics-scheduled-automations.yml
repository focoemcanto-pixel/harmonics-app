name: Harmonics scheduled automations

# O agendamento passou para o Cron Trigger do Worker (wrangler.toml → [triggers]), porque o
# schedule do GitHub atrasava e pulava execuções. Este workflow fica só para execução manual
# (Actions → Run workflow); a deduplicação de envios impede ação repetida.
on:
  workflow_dispatch:

concurrency:
  group: harmonics-scheduled-automations
  cancel-in-progress: false

jobs:
  run-automation-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run Harmonics date automations
        env:
          CRON_SECRET: ${{ secrets.HARMONICS_CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="https://app.bandaharmonics.com/api/automation/cron"
          # A rota é fail-closed: sem o segredo o cron não roda. Falhar aqui deixa o
          # problema visível em vez de chamar a rota sem autenticação.
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Secret HARMONICS_CRON_SECRET não configurado no repositório."
            exit 1
          fi
          # Repositório público: o log do Actions é público. Só o status e os totais.
          HTTP_CODE=$(curl --show-error --silent --retry 2 --max-time 120 \
            -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "x-cron-source: github-actions" \
            "$URL")
          echo "HTTP ${HTTP_CODE}"
          jq -c '{ok, workspacesProcessed, totalEligible, totalSent, totalSkipped, totalFailed, error}' response.json || true
          rm -f response.json
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            exit 1
          fi
