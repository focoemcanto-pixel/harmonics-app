name: Nara v2 temporary SDK dependency lock
on:
  push:
    branches:
      - feat/nara-agent-v2-ai-sdk-20261111
    paths:
      - .github/workflows/nara-v2-deps.yml
permissions:
  contents: write
jobs:
  install-sdk-lock:
    if: github.ref == 'refs/heads/feat/nara-agent-v2-ai-sdk-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nara-agent-v2-ai-sdk-20261111
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate exact SDK dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund 'ai@^7.0.0' '@ai-sdk/openai@^4.0.0'
      - name: Commit lock to same feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(nara-v2): install official Vercel AI SDK and OpenAI provider'
            git push origin HEAD:feat/nara-agent-v2-ai-sdk-20261111
          fi
