<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Sem conexão • Harmonics</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font: 16px/1.5 system-ui, -apple-system, sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 8px; color: #fff; }
  button { margin-top: 20px; width: 100%; padding: 14px; border: 0; border-radius: 14px; background: #a78bfa; color: #0f172a; font-weight: 800; font-size: 16px; }
</style>
</head>
<body>
<main>
  <h1>Você está sem conexão</h1>
  <p>Assim que a internet voltar, o Harmonics continua de onde você parou.</p>
  <button onclick="location.reload()">Tentar novamente</button>
</main>
</body>
</html>
