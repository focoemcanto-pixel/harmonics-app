# Deploy only with `wrangler preview --name nara-v2-pr839 --config wrangler.nara-preview.toml`.
name = "harmonics-app"
main = ".open-next/worker.js"
compatibility_date = "2026-03-27"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"

[previews.vars]
AI_NARA_ROAD_GEO_ENABLED = "true"

[build]
command = "[ \"$WORKERS_CI_BRANCH\" = \"preview/nara-pr839-42d26186\" ] && env -u SUPABASE_SERVICE_ROLE_KEY -u WHATSAPP_API_KEY -u WHATSAPP_API_URL -u WHATSAPP_INSTANCE_ID npx --yes wrangler@4.135.0 preview --name nara-v2-pr839 --config wrangler.nara-preview.toml --tag 42d26186e3a0"
